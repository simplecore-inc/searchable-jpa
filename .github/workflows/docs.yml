name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/build-docs.sh'
      - 'scripts/prepare-docs.mjs'
      - 'scripts/tests/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Released x.y.z version to build. Leave empty for snapshot.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ -n "$INPUT_VERSION" ] && [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the stable x.y.z format."
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ]; then
            echo "ref=v${INPUT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "ref=master" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            FOLDER_NAME="$INPUT_VERSION"
            IS_RELEASE="true"
          else
            VERSION=$(grep "version = " build.gradle | head -1 | sed "s/.*version = '\([^']*\)'.*/\1/")
            FOLDER_NAME="snapshot"
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Building documentation for version: $VERSION (folder: $FOLDER_NAME, release: $IS_RELEASE)"

      - name: Build documentation
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build-docs.sh
          ./scripts/build-docs.sh

      - name: Checkout gh-pages
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Checkout current navigation tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          path: .docs-tooling
          sparse-checkout: |
            docs/assets
            scripts/prepare-docs.mjs
          sparse-checkout-cone-mode: false

      - name: Prepare deployment
        env:
          FOLDER_NAME: ${{ steps.version.outputs.folder_name }}
        run: node .docs-tooling/scripts/prepare-docs.mjs gh-pages build-docs deploy "$FOLDER_NAME"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: false
