name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch'
        required: true
        default: 'spring-boot-3x'

concurrency:
  group: release-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Extract and validate version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          case "$RELEASE_BRANCH" in master|spring-boot-3x) ;; *) echo "Unsupported release branch"; exit 1;; esac
          # Extract current version from build.gradle
          CURRENT_VERSION=$(grep -oP "version = '\K[^']+" build.gradle | head -1)
          echo "Current version: $CURRENT_VERSION"

          # Check if it's a SNAPSHOT version
          if [[ ! "$CURRENT_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Current version '$CURRENT_VERSION' is not a SNAPSHOT version. Release aborted."
            exit 1
          fi

          # Remove -SNAPSHOT suffix to get release version
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "Release version: $RELEASE_VERSION"

          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi

          # Export versions for subsequent steps
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Gradle Cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Update project and documentation version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          node scripts/set-project-version.mjs "$RELEASE_VERSION"
          git config --global user.email "thk@simplecore.kr"
          git config --global user.name "Taehwan Kwag"
          git add build.gradle README.md docs
          git commit -m "release: v$RELEASE_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build and Publish
        run: |
          chmod +x ./gradlew
          npm ci
          npm run test:docs
          ./scripts/build-docs.sh
          ./gradlew clean check performanceTest publish --stacktrace
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          git tag -a "v$RELEASE_VERSION" -m "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Update to Next Development Version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          NEXT_VERSION=$(echo "$RELEASE_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')-SNAPSHOT
          node scripts/set-project-version.mjs "$NEXT_VERSION"
          git add build.gradle README.md docs
          git commit -m "chore: prepare for next development version $NEXT_VERSION"
          git push origin "$BRANCH"

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.release }}
          name: Release v${{ steps.version.outputs.release }}
          body_path: release-notes.md
          make_latest: ${{ github.event.inputs.branch == 'master' && 'true' || 'false' }}
          draft: false
          prerelease: false 
