plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
    id 'maven-publish'
}

ext {
    springBootVersion = '4.1.2'
    springDependencyManagementVersion = '1.1.7'
    
    // Dependency versions - only for dependencies not managed by Spring Boot
    versions = [
        // SpringDoc OpenAPI versions (not managed by Spring Boot)
        springdocOpenapiStarter: '3.2.0',
        
        // Other dependencies not managed by Spring Boot
        modelmapper: '3.2.8',
        mssqlJdbc: '13.6.1.jre11'
    ]

    // Stable releases verified against Maven Central on 2026-10-30.
    // Explicit declarations also override the BOM automatically imported by the Boot plugin.
    stableDependencyVersions = [
        'org.projectlombok:lombok': '1.18.48',
        'org.slf4j:slf4j-api': '2.0.20',
        'org.slf4j:jul-to-slf4j': '2.0.20',
        'com.fasterxml.jackson.datatype:jackson-datatype-jdk8': '2.22.4',
        'com.fasterxml.jackson.module:jackson-module-parameter-names': '2.22.4',
        'org.webjars:webjars-locator-lite': '1.1.5',
        'org.jspecify:jspecify': '1.0.1',
        'io.micrometer:micrometer-commons': '1.17.2',
        'io.micrometer:micrometer-observation': '1.17.2',
        'io.smallrye:jandex': '3.6.0',
        'net.minidev:json-smart': '2.6.0',
        'net.minidev:accessors-smart': '2.6.0',
        'org.awaitility:awaitility': '4.3.0',
        'ch.qos.logback:logback-classic': '1.6.6',
        'ch.qos.logback:logback-core': '1.6.6',
        'com.fasterxml:classmate': '1.8.0',
        'com.sun.istack:istack-commons-runtime': '4.2.0',
        'com.zaxxer:HikariCP': '7.1.0',
        'commons-logging:commons-logging': '1.4.0',
        'net.bytebuddy:byte-buddy': '1.18.16',
        'net.bytebuddy:byte-buddy-agent': '1.18.16',
        'org.apache.commons:commons-lang3': '3.21.0',
        'org.aspectj:aspectjweaver': '1.9.26',
        'org.hibernate.models:hibernate-models': '1.3.4',
        'org.hibernate.orm:hibernate-core': '7.4.14.Final',
        'org.yaml:snakeyaml': '2.7',
        'com.fasterxml.jackson.core:jackson-annotations': '2.22',
        'com.fasterxml.jackson.core:jackson-core': '2.22.4',
        'com.fasterxml.jackson.core:jackson-databind': '2.22.4',
        'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml': '2.22.4',
        'com.fasterxml.jackson.datatype:jackson-datatype-jsr310': '2.22.4',
        'tools.jackson.core:jackson-core': '3.2.4',
        'tools.jackson.core:jackson-databind': '3.2.4',
        'org.apache.logging.log4j:log4j-api': '2.26.1',
        'org.apache.logging.log4j:log4j-to-slf4j': '2.26.1',
        'com.jayway.jsonpath:json-path': '3.0.0',
        'org.mockito:mockito-core': '5.24.0',
        'org.mockito:mockito-junit-jupiter': '5.24.0',
        'org.xmlunit:xmlunit-core': '2.14.0',
        'org.objenesis:objenesis': '3.6',
        'org.ow2.asm:asm': '9.11.1',
        'com.h2database:h2': '2.5.252',
        'org.junit.jupiter:junit-jupiter': '6.1.3',
        'org.junit.jupiter:junit-jupiter-api': '6.1.3',
        'org.junit.jupiter:junit-jupiter-engine': '6.1.3',
        'org.junit.jupiter:junit-jupiter-params': '6.1.3',
        'org.junit.platform:junit-platform-launcher': '6.1.3',
        'org.junit.platform:junit-platform-commons': '6.1.3',
        'org.junit.platform:junit-platform-engine': '6.1.3'
    ]
    if (springBootVersion.startsWith('3.')) {
        stableDependencyVersions.putAll([
            'org.hibernate.validator:hibernate-validator': '8.0.6.Final',
            'org.apache.tomcat.embed:tomcat-embed-core': '10.1.61',
            'org.apache.tomcat.embed:tomcat-embed-el': '10.1.61',
            'org.apache.tomcat.embed:tomcat-embed-websocket': '10.1.61'
        ])
    }
}

allprojects {
    group = 'dev.simplecore.searchable'
    version = '2.0.1-SNAPSHOT'

    System.setProperty("spring.boot.version.check.enabled", "false")

    // Version compatibility validation
    afterEvaluate {
        def versionStr = version.toString()

        // Each release line is bound to one Spring Boot generation:
        // 2.x -> Boot 4 (master), 1.x -> Boot 3 (spring-boot-3x), 0.1.x -> Boot 2.7 (spring-boot-2x)
        if (!versionStr.startsWith('2.')) {
            throw new GradleException("This branch builds the 2.x line only, but the version is ${version}")
        }
        if (!springBootVersion.startsWith('4.')) {
            throw new GradleException("Version ${version} requires Spring Boot 4.x, but current version is ${rootProject.springBootVersion}")
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.springBootVersion}"
            mavenBom 'com.fasterxml.jackson:jackson-bom:2.22.4'
            mavenBom 'tools.jackson:jackson-bom:3.2.4'
            mavenBom 'org.apache.logging.log4j:log4j-bom:2.26.1' 
        }
        
        dependencies {
            rootProject.stableDependencyVersions.each { coordinate, stableVersion ->
                dependency "${coordinate}:${stableVersion}"
            }
            // SpringDoc OpenAPI versions (not managed by Spring Boot)
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.versions.springdocOpenapiStarter}"
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-api:${rootProject.versions.springdocOpenapiStarter}"
            
            // Other dependencies not managed by Spring Boot
            dependency "org.modelmapper:modelmapper:${rootProject.versions.modelmapper}"
            dependency "com.microsoft.sqlserver:mssql-jdbc:${rootProject.versions.mssqlJdbc}"
        }
    }

    apply plugin: 'maven-publish'
    
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                
                // Resolve version conflicts for Maven publishing
                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                pom {
                    def metadata = [
                        'searchable-jpa-core': [
                            name: 'Searchable JPA Core',
                            description: 'Core library for Searchable JPA'
                        ],
                        'searchable-jpa-openapi': [
                            name: 'Searchable JPA OpenAPI',
                            description: 'OpenAPI/Swagger support for Searchable JPA'
                        ],
                        'spring-boot-starter-searchable-jpa': [
                            name: 'Spring Boot Starter for Searchable JPA',
                            description: 'Spring Boot Starter for Searchable JPA'
                        ]
                    ]
                    if (metadata.containsKey(project.name)) {
                        def projectMetadata = metadata[project.name]
                        setName(projectMetadata['name'])
                        setDescription(projectMetadata['description'])
                    } else {
                        throw new RuntimeException("No metadata found for project: ${project.name}")
                    }
                    url = 'https://github.com/simplecore-inc/searchable-jpa'

                    licenses {
                        license {
                            name = 'SimpleCORE License 1.0 (SCL-1.0)'
                            url = 'https://github.com/simplecore-inc/searchable-jpa/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'thkwag'
                            name = 'Taehwan Kwag'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/simplecore-inc/searchable-jpa.git'
                        developerConnection = 'scm:git:ssh://github.com:simplecore-inc/searchable-jpa.git'
                        url = 'https://github.com/simplecore-inc/searchable-jpa'
                    }

                    // Add version compatibility information (properties)
                    withXml {
                        def properties = asNode().get('properties')
                        if (properties.isEmpty()) {
                            properties = asNode().appendNode('properties')
                        }

                        // Spring Boot version compatibility information
                        properties.appendNode('spring-boot.version.required', '[4.1.0,5.0.0)')
                        properties.appendNode('jakarta.version.required', '11+')
                        properties.appendNode('javax.version.supported', 'false')
                    }
                }
            }
        }
        
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/simplecore-inc/searchable-jpa")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                    password = project.findProperty("gpr.token") ?: System.getenv("TOKEN")
                }
            }
        }
    }
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters', "-Xlint:-deprecation", "-Xlint:-options"])
    }

    test {
        useJUnitPlatform()
        
        // Always run tests, never consider them up-to-date
        outputs.upToDateWhen { false }
        
        // Clean test results before running
        doFirst {
            delete fileTree(dir: "${buildDir}/test-results", include: '**/*')
            delete fileTree(dir: "${buildDir}/reports/tests", include: '**/*')
        }
    }
}

wrapper {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607'
}