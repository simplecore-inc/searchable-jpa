apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

configurations.all {
    exclude group: 'javax.persistence', module: 'javax.persistence-api'
    exclude group: 'javax.validation', module: 'validation-api'
    exclude group: 'org.hibernate', module: 'hibernate-entitymanager'
}

dependencies {
    // Jakarta EE API and validator versions come from the Spring Boot BOM
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.validator:hibernate-validator'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api'

    // Spring Boot starters (will use appropriate versions based on springBootVersion)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // Both Jackson generations are supported by the public search-condition API.
    api 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'tools.jackson.core:jackson-databind'

    // Other dependencies
    implementation 'org.modelmapper:modelmapper'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

test {
    useJUnitPlatform {
        // Exclude performance tests from regular test runs
        excludeTags 'performance'
    }
    
    // Always run tests, never consider them up-to-date
    outputs.upToDateWhen { false }
    
    // Pass system properties to test JVM
    systemProperties = System.properties
    
    // Enable passing specific system properties
    if (System.getProperty('spring.profiles.active')) {
        systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active')
    }
    
    // Clean test results before running
    doFirst {
        delete fileTree(dir: "${buildDir}/test-results", include: '**/*')
        delete fileTree(dir: "${buildDir}/reports/tests", include: '**/*')
    }
}

// Performance test task - run separately
tasks.register('performanceTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    group = 'verification'
    description = 'Run performance tests manually'
    
    useJUnitPlatform {
        includeTags 'performance'
    }
    
    // Pass system properties to test JVM
    systemProperties = System.properties
    
    // Enable passing specific system properties
    if (System.getProperty('spring.profiles.active')) {
        systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active')
    }
    
    // Always run performance tests, never consider them up-to-date
    outputs.upToDateWhen { false }
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

compileJava.inputs.files(processResources)

compileJava {
    options.compilerArgs << '-parameters'
}

// Task to generate test data
task generateLargeData(type: JavaExec) {
    group = 'data'
    description = 'Generate large test dataset (5M records)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.simplecore.searchable.test.fixture.CsvTestDataGenerator'
    args = ['large']
}

task generateSmallData(type: JavaExec) {
    group = 'data'
    description = 'Generate small test dataset (10K records)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.simplecore.searchable.test.fixture.CsvTestDataGenerator'
    args = ['small']
}