spring:
  profiles:
    default: test  # Set default profile to 'test' if no profile is specified
  datasource:
    # H2 in-memory database with optimizations for bulk operations
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;LOCK_MODE=0
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Test-only SQL inspector (inert until a test calls TestSqlCapture.start())
        session_factory:
          statement_inspector: dev.simplecore.searchable.test.support.TestSqlCapture
        # Batch processing optimizations
        jdbc:
          batch_size: 1000
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # N+1 problem optimization
        default_batch_fetch_size: 100
        # Connection pool settings
        connection:
          provider_disables_autocommit: true
        # Query optimization
        query:
          in_clause_parameter_padding: true
        # Cache settings
        cache:
          use_second_level_cache: false
          use_query_cache: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: DEBUG
    org.springframework.orm.jpa: DEBUG
    dev.simplecore.searchable: DEBUG

searchable:
  swagger:
    enabled: true 