ection</text><text x="1166.0" y="647.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#9ece6a" font-weight="400" text-anchor="start">@Qualifier("searchConditionCustomizer")</text><text x="1166.0" y="666.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#565f89" font-weight="400" text-anchor="start">Path B - inject the full customizer list</text><text x="1166.0" y="685.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#9ece6a" font-weight="400" text-anchor="start">List&lt;OperationCustomizer&gt; → forEach</text><path d="M 1130.0 500.0 L 1130.0 530.0 Q 1130.0 540.0 1120.0 540.0 L 930.0 540.0 Q 920.0 540.0 920.0 550.0 L 920.0 580.0" fill="none" stroke="#f7768e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><path d="M 1130.0 500.0 L 1130.0 530.0 Q 1130.0 540.0 1140.0 540.0 L 1330.0 540.0 Q 1340.0 540.0 1340.0 550.0 L 1340.0 580.0" fill="none" stroke="#9ece6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><rect x="959.2" y="529.2" width="131.6" height="20.4" rx="6" fill="#16161e" stroke="#3b4261" stroke-width="1" opacity="0.96"/><text x="1025.0" y="544.1" font-family="'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#f7768e" font-weight="600" text-anchor="middle">✖ incorrect wiring</text><rect x="1175.6" y="529.2" width="118.7" height="20.4" rx="6" fill="#16161e" stroke="#3b4261" stroke-width="1" opacity="0.96"/><text x="1235.0" y="544.1" font-family="'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#9ece6a" font-weight="600" text-anchor="middle">✔ correct wiring</text></svg>