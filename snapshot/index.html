<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Searchable JPA Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Searchable JPA - Dynamic Search, Sorting, and Pagination for Spring Data JPA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="keywords" content="Searchable JPA, Spring Boot, Spring Data JPA, Dynamic Search, Two-Phase Query Optimization">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>S</text></svg>">

  <!-- Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css">

  <!-- Prism syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --theme-color: #ea580c;
      --sidebar-width: 280px;
    }

    /* Korean font optimization */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    /* Sidebar styling */
    .sidebar {
      padding-left: 20px;
    }

    .sidebar-nav li {
      margin: 6px 0;
    }

    .app-sub-sidebar {
      margin-left: 1em;
    }

    /* Code block styling */
    .markdown-section code {
      border-radius: 4px;
    }

    .markdown-section pre {
      border-radius: 8px;
    }

    /* Table styling */
    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section th {
      background-color: #f8f8f8;
    }

    /* Cover page styling */
    section.cover {
      background: linear-gradient(to bottom, #fdba74 0%, #fdba74 50%, #ffffff 100%) !important;
      background-color: #fdba74 !important;
    }

    section.cover.show {
      background: linear-gradient(to bottom, #fdba74 0%, #fdba74 50%, #ffffff 100%) !important;
    }

    .cover-main {
      background: transparent !important;
    }

    section.cover h1 {
      color: #9a3412 !important;
    }

    section.cover p {
      color: #7c2d12 !important;
    }

    section.cover ul li {
      color: #7c2d12 !important;
    }

    section.cover .cover-main > p:last-child a {
      border-radius: 4px;
      color: #fff !important;
      border-color: #ea580c;
      background-color: #ea580c;
    }

    section.cover .cover-main > p:last-child a:hover {
      background-color: #c2410c;
    }

    section.cover a.github-corner {
      fill: #ea580c !important;
    }

    /* Search styling */
    .search input {
      border-radius: 4px;
    }

    /* Responsive sidebar */
    @media screen and (max-width: 768px) {
      :root {
        --sidebar-width: 240px;
      }
    }

  </style>
<link rel="stylesheet" href="assets/version-selector.css">
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: '<img src="https://img.shields.io/badge/Searchable-JPA-ea580c?style=for-the-badge" alt="Searchable JPA">',
      nameLink: '#/',
      repo: 'https://github.com/simplecore-inc/searchable-jpa',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,

      // Default to English (relative paths for versioned folders)
      homepage: 'en/README.md',

      // Alias for sidebar/navbar loading (relative paths)
      alias: {
        '/ko/.*/_sidebar.md': 'ko/_sidebar.md',
        '/ko/_sidebar.md': 'ko/_sidebar.md',
        '/.*/_sidebar.md': 'en/_sidebar.md',
        '/.*/_navbar.md': '_navbar.md'
      },

      // Search configuration
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/ko/': '검색...',
          '/en/': 'Search...',
          '/': 'Search...'
        },
        noData: {
          '/ko/': '결과 없음',
          '/en/': 'No results',
          '/': 'No results'
        },
        depth: 3,
        namespace: 'searchable-jpa-docs-' + window.location.pathname.replace(/index\.html$/, ''),
        pathNamespaces: ['/en', '/ko']
      },

      // Pagination - will be set dynamically based on language
      pagination: {
        previousText: 'Prev',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },

      // Copy code button - will be set dynamically based on language
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      // Tab support
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic'
      },

      // Markdown configuration
      markdown: {
        smartypants: true
      },

      // Plugins configuration
      plugins: [
        // Language-aware UI text
        function(hook, vm) {
          var i18n = {
            ko: {
              pagination: { previousText: '이전', nextText: '다음' },
              copyCode: { buttonText: '복사', errorText: '오류', successText: '완료' },
              editText: 'GitHub에서 편집'
            },
            en: {
              pagination: { previousText: 'Prev', nextText: 'Next' },
              copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
              editText: 'Edit on GitHub'
            }
          };

          function getLang(path) {
            if (path && path.startsWith('/ko/')) return 'ko';
            return 'en'; // default
          }

          hook.init(function() {
            var lang = getLang(window.location.hash.replace('#', ''));
            var texts = i18n[lang] || i18n.en;

            // Update pagination text
            if (window.$docsify.pagination) {
              window.$docsify.pagination.previousText = texts.pagination.previousText;
              window.$docsify.pagination.nextText = texts.pagination.nextText;
            }

            // Update copyCode text
            if (window.$docsify.copyCode) {
              window.$docsify.copyCode.buttonText = texts.copyCode.buttonText;
              window.$docsify.copyCode.errorText = texts.copyCode.errorText;
              window.$docsify.copyCode.successText = texts.copyCode.successText;
            }
          });

          hook.doneEach(function() {
            var lang = getLang(vm.route.path);
            var texts = i18n[lang] || i18n.en;

            document.documentElement.lang = lang;
            // Update pagination buttons after each page load
            var prevBtn = document.querySelector('.pagination-item--previous .pagination-item-title');
            var nextBtn = document.querySelector('.pagination-item--next .pagination-item-title');
            if (prevBtn) prevBtn.textContent = texts.pagination.previousText;
            if (nextBtn) nextBtn.textContent = texts.pagination.nextText;
          });
        },
        // Footer with edit link
        function(hook, vm) {
          var editTexts = { ko: 'GitHub에서 원본 보기', en: 'View source on GitHub' };

          hook.beforeEach(function(html) {
            if (/githubusercontent\.com/.test(vm.route.file)) {
              return html;
            }
            var lang = (vm.route.path && vm.route.path.startsWith('/ko/')) ? 'ko' : 'en';
            var editText = editTexts[lang] || editTexts.en;
            var file = vm.route.file.replace(/^\/+/, '');
            if (!/^(en|ko)\/[A-Za-z0-9_-]+\.md$/.test(file)) return html;
            var release = /\/(\d+\.\d+\.\d+)\/(?:index\.html)?$/.exec(window.location.pathname);
            var ref = release ? 'v' + release[1] : 'master';
            var url = 'https://github.com/simplecore-inc/searchable-jpa/blob/' + ref + '/docs/' + file;
            var editHtml = '\n\n---\n\n' +
              '<div style="text-align: right; font-size: 0.9em; color: #999;">' +
              '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color: #999;">' + editText + '</a>' +
              '</div>';
            return html + editHtml;
          });
        }
      ]
    }
  </script>

  <!-- Version selector -->
<script src="assets/version-selector.js"></script>
<!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1.6.3"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-groovy.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-properties.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-kotlin.min.js"></script>

  <!-- Mermaid diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
    window.$docsify.markdown = {
      renderer: {
        code: function(code, lang) {
          if (lang === 'mermaid') {
            return '<div class="mermaid">' + code + '</div>';
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

</body>
</html>
